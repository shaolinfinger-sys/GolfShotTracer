name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Gradle Wrapper files locally
        run: |
          mkdir -p gradle/wrapper
          
          # Create gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

          # Create minimal gradlew script
          cat > gradlew << 'SCRIPT'
#!/bin/sh
##############################################################################
##
##  Gradle start up script for UN*X
##
##############################################################################
APP_HOME=$( cd "$( dirname "$0" )" && pwd )
CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
if [ -z "$JAVA_HOME" ] ; then
  JAVA_EXEC=java
else
  JAVA_EXEC=$JAVA_HOME/bin/java
fi
exec "$JAVA_EXEC" -Xmx64m -Xms64m -classpath "$CLASSPATH" \
    "-Dorg.gradle.appname=$(basename "$0")" \
    org.gradle.wrapper.GradleWrapperMain "$@"
SCRIPT

          chmod +x gradlew
          echo "Wrapper files created"

      - name: Download Gradle Wrapper JAR
        run: |
          wget -O gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          ls -la gradle/wrapper/

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GolfShotTracer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
